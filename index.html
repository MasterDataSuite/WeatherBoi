<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thessaloniki Weather</title>
<meta name="description" content="Current weather and forecast for Thessaloniki from Open-Meteo">
<meta name="theme-color" content="#2c6aa8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sky band on top that changes with the weather (place, now, what to wear),
   then a calm column: next 24 hours chart -> 7 days (tap to expand) -> this day last year */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --ink: #142128;
  --muted: #5b6b73;
  --line: #d5dee1;
  --sea: #2c6e8a;
  --sun: #d98f1e;
  --rain: #3b7fc0;
  --cloud: #9aa9b3;
  --moon: #b7a46a;
  --snow: #7fa3c4;
  --night: rgba(30, 50, 70, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171c; --surface: #16232a; --ink: #e4ecef; --muted: #8fa1a9;
    --line: #26363e; --sea: #6db3d1; --sun: #e8ad4f; --rain: #77aee6;
    --cloud: #8597a3; --moon: #e6d9a8; --snow: #b5cde3; --night: rgba(160, 190, 210, .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171c; --surface: #16232a; --ink: #e4ecef; --muted: #8fa1a9;
  --line: #26363e; --sea: #6db3d1; --sun: #e8ad4f; --rain: #77aee6;
  --cloud: #8597a3; --moon: #e6d9a8; --snow: #b5cde3; --night: rgba(160, 190, 210, .06);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Sky band: its own fixed palette, chosen by the weather ---------- */
.sky {
  --sky-a: #2c6aa8; --sky-b: #4b93cc;
  --ink-on: #ffffff; --soft-on: rgba(255,255,255,.78);
  --sun: #ffd36b; --cloud: rgba(255,255,255,.94); --moon: #f6ecc9; --rain: #d3e8ff; --snow: #ffffff;
  position: relative; overflow: hidden; color: var(--ink-on);
  background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
  padding-top: env(safe-area-inset-top, 0px);
  transition: background .8s ease;
}
.sky--clear-day    { --sky-a: #2468a6; --sky-b: #4a92cb; }
.sky--clear-night  { --sky-a: #08142b; --sky-b: #1f3457; }
.sky--cloudy-day   { --sky-a: #4e6273; --sky-b: #74889a; }
.sky--cloudy-night { --sky-a: #161e28; --sky-b: #344255; }
.sky--rain         { --sky-a: #2b3d4c; --sky-b: #4f6577; }
.sky--storm        { --sky-a: #16182a; --sky-b: #3d3654; }
.sky--snow         { --sky-a: #50677f; --sky-b: #7d93a9; }
.sky--fog          { --sky-a: #4f585e; --sky-b: #737d83; }
.sky--dusk         { --sky-a: #33386a; --sky-b: #c0694f; }

.sky::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s; }
.sky--clear-night::before {
  opacity: .9;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 9%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 58% 22%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 76% 12%, #fff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 90% 30%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 40%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 44%, #fff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 45% 35%, #fff 50%, transparent 51%);
}
.sky--rain::before, .sky--storm::before {
  opacity: .22;
  background-image: repeating-linear-gradient(105deg, transparent 0 14px, rgba(255,255,255,.55) 14px 15px, transparent 15px 31px);
  background-size: 200px 200px;
}
@media (prefers-reduced-motion: no-preference) {
  .sky--rain::before, .sky--storm::before { animation: fall 1.1s linear infinite; }
}
@keyframes fall { to { background-position: -50px 200px; } }

.sky-inner { position: relative; display: grid; gap: 18px; padding-block: 22px 22px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.place { min-width: 0; }
.place h1 { font: 700 1.6rem/1.1 var(--display); margin: 0; text-wrap: balance; }
.place p { margin: 2px 0 0; color: var(--soft-on); font-size: .85rem; }
form { display: flex; gap: 6px; }
.sr { position: absolute; left: -9999px; }
input {
  width: 9.5rem; padding: 7px 10px; border-radius: 8px; font: inherit; font-size: .9rem;
  border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.14); color: var(--ink-on);
}
input::placeholder { color: var(--soft-on); }
button {
  padding: 7px 12px; border: 0; border-radius: 8px; background: rgba(255,255,255,.92); color: #142128;
  font: 600 .9rem var(--body); cursor: pointer;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.now-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.now-icon { width: 76px; height: 76px; flex: none; }
.temp { font: 700 4.4rem/0.9 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.temp small { font-size: 1.6rem; color: var(--soft-on); font-weight: 500; }
.cond { display: grid; gap: 2px; }
.cond strong { font: 600 1.15rem var(--body); }
.cond span { color: var(--soft-on); font-size: .9rem; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 0;
  padding-top: 14px; border-top: 1px solid rgba(255,255,255,.22); }
.facts div { display: grid; gap: 1px; }
.facts dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--soft-on); }
.facts dd { margin: 0; font: 500 1rem var(--mono); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
  background: rgba(255,255,255,.9); color: #142128; font: 600 .68rem var(--body); letter-spacing: .05em; vertical-align: 2px;
}

.wear {
  display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
}
.wear .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft-on); }
.wear strong { font: 700 1.2rem var(--display); }
.wear p { margin: 0; font-size: .92rem; }
.wear p + p { color: var(--soft-on); }

/* ---------- Content ---------- */
.content { display: grid; gap: 26px; padding-block: 24px 40px; }
h2 { font: 600 .75rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }

.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 0 4px; }
#chart { width: 100%; min-height: 196px; }
#chart svg { display: block; }
.chart-note { margin: 6px 14px 4px; font-size: .78rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.chart-note i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.k-temp { background: var(--sea); } .k-rain { background: var(--rain); opacity: .55; } .k-night { background: var(--cloud); opacity: .3; }

.c-line { fill: none; stroke: var(--sea); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.c-stop1 { stop-color: var(--sea); stop-opacity: .26; } .c-stop2 { stop-color: var(--sea); stop-opacity: 0; }
.c-night { fill: var(--night); }
.c-rain { fill: var(--rain); opacity: .55; }
.c-axis { stroke: var(--line); stroke-width: 1; }
.c-temp { fill: var(--ink); font: 600 12px var(--mono); }
.c-time { fill: var(--muted); font: 400 10.5px var(--mono); }
.c-now { fill: var(--sea); stroke: var(--surface); stroke-width: 2; }

.days { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.days li { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
.day {
  display: grid; grid-template-columns: 3.2rem 28px 1fr auto auto 14px; gap: 10px; align-items: center;
  padding: 10px 2px; font-variant-numeric: tabular-nums;
}
.day:hover { background: var(--night); }
.day .d { font-weight: 600; }
.day .ic { width: 28px; height: 28px; }
.day .c { color: var(--muted); font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day .r { font: 400 .8rem var(--mono); color: var(--rain); text-align: right; min-width: 2.6rem; }
.day .hl { font: 500 .95rem var(--mono); text-align: right; min-width: 5.4rem; }
.day .hl span { color: var(--muted); }
.day .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); justify-self: center; margin-top: -4px; transition: transform .2s; }
details[open] .chev { transform: rotate(-135deg); margin-top: 4px; }

.day-more { padding: 4px 0 14px; display: grid; gap: 10px; }
.slots-wrap { overflow-x: auto; }
.slots { display: grid; grid-template-columns: repeat(8, minmax(52px, 1fr)); gap: 6px; min-width: 440px; }
.slot {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums;
}
.slot .t { font: 400 .74rem var(--mono); color: var(--muted); }
.slot .ic { width: 26px; height: 26px; }
.slot .v { font: 600 .95rem var(--mono); }
.slot .p { font: 400 .7rem var(--mono); color: var(--rain); min-height: 1.05em; }
.day-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 .82rem var(--mono); color: var(--muted); }
.day-meta b { color: var(--ink); font-weight: 500; }

.lastyear { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.ly-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ly-row .ic { width: 44px; height: 44px; flex: none; }
.ly-main { display: grid; gap: 1px; min-width: 0; }
.ly-main .when { font-size: .82rem; color: var(--muted); }
.ly-main .vals { font: 600 1.25rem var(--mono); font-variant-numeric: tabular-nums; }
.ly-main .vals span { color: var(--muted); font-weight: 400; }
.ly-main .what { font-size: .9rem; }
.ly-compare { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: .92rem; }
.ly-compare b { color: var(--sea); }

.sun-row { display: flex; gap: 20px; color: var(--muted); font: 400 .85rem var(--mono); }
.sun-row b { color: var(--sun); font-weight: 500; }

footer { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
footer a { color: var(--sea); }

/* ---------- Icons ---------- */
.ic-sun circle { fill: var(--sun); }
.ic-sun line { stroke: var(--sun); stroke-width: 2.2; stroke-linecap: round; }
.ic-moon { fill: var(--moon); }
.ic-cloud { fill: var(--cloud); }
.ic-rain { stroke: var(--rain); stroke-width: 2.2; stroke-linecap: round; }
.ic-snow { fill: var(--snow); }
.ic-bolt { fill: var(--sun); }
.ic-fog { stroke: var(--cloud); stroke-width: 2.4; stroke-linecap: round; }

.loading .temp, .loading .content { opacity: .55; }
</style>
</head>
<body>
<div id="app" class="loading">
  <section class="sky sky--cloudy-day" id="sky">
    <div class="wrap sky-inner">
      <header>
        <div class="place">
          <h1 id="place">Thessaloniki</h1>
          <p id="sub">Loading forecast…</p>
        </div>
        <form id="search">
          <label for="city" class="sr">City</label>
          <input id="city" name="city" placeholder="Other city" autocomplete="off">
          <button type="submit">Go</button>
        </form>
      </header>

      <div class="now-top" aria-label="Current conditions">
        <svg class="now-icon" id="now-icon" viewBox="0 0 32 32" aria-hidden="true"></svg>
        <div class="temp" id="temp">--<small>°C</small></div>
        <div class="cond"><strong id="cond">&nbsp;</strong><span id="feels">&nbsp;</span></div>
      </div>

      <dl class="facts">
        <div><dt>Today</dt><dd id="hilo">–</dd></div>
        <div><dt>Rain chance</dt><dd id="rain">–</dd></div>
        <div><dt>Wind</dt><dd id="wind">–</dd></div>
        <div><dt>Humidity</dt><dd id="hum">–</dd></div>
      </dl>

      <div class="wear" id="wear" hidden>
        <span class="label">What to wear</span>
        <strong id="wear-title"></strong>
        <p id="wear-line"></p>
        <p id="wear-extra"></p>
      </div>
    </div>
  </section>

  <div class="wrap content">
    <section aria-label="Next 24 hours">
      <h2>Next 24 hours</h2>
      <div class="chart-box">
        <div id="chart"></div>
        <div class="chart-note">
          <span><i class="k-temp"></i>Temperature</span>
          <span><i class="k-rain"></i>Chance of rain</span>
          <span><i class="k-night"></i>Night</span>
        </div>
      </div>
    </section>

    <section aria-label="7-day forecast">
      <h2>7 days · tap a day for details</h2>
      <ul class="days" id="days"></ul>
    </section>

    <section aria-label="This day last year" id="ly-section" hidden>
      <h2>This day last year</h2>
      <div class="lastyear">
        <div class="ly-row">
          <svg class="ic" id="ly-icon" viewBox="0 0 32 32" aria-hidden="true"></svg>
          <div class="ly-main">
            <span class="when" id="ly-when"></span>
            <span class="vals" id="ly-vals"></span>
            <span class="what" id="ly-what"></span>
          </div>
        </div>
        <p class="ly-compare" id="ly-compare"></p>
      </div>
    </section>

    <div class="sun-row" id="sun"></div>

    <footer>
      <span id="updated"></span>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
    </footer>
  </div>
</div>

<script>
const DEFAULT = { name: "Thessaloniki", country: "Greece", lat: 40.6401, lon: 22.9444 };

const CODES = {
  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Freezing fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Light showers", 81: "Showers", 82: "Violent showers", 85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Severe thunderstorm, hail"
};
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const SKY_TOP = {
  "clear-day": "#2468a6", "clear-night": "#08142b", "cloudy-day": "#4e6273", "cloudy-night": "#161e28",
  rain: "#2b3d4c", storm: "#16182a", snow: "#50677f", fog: "#4f585e", dusk: "#33386a"
};

const $ = id => document.getElementById(id);
const round = n => Math.round(n);
const compass = deg => COMPASS[Math.round(deg / 22.5) % 16];
const hhmm = iso => iso.slice(11, 16);
const mins = iso => { const d = new Date(iso); return d.getTime() / 60000; };

function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

/* ---------- Icons ---------- */
function kindOf(code) {
  if (code === 0) return "clear";
  if (code <= 2) return "partly";
  if (code === 3) return "cloud";
  if (code <= 48) return "fog";
  if (code <= 57) return "drizzle";
  if (code <= 67) return "rain";
  if (code <= 77) return "snow";
  if (code <= 82) return "rain";
  if (code <= 86) return "snow";
  return "storm";
}
function cloud(dx, dy) {
  return `<g class="ic-cloud" transform="translate(${dx},${dy})"><circle cx="12" cy="18" r="5"/><circle cx="18" cy="15" r="6.5"/><circle cx="23" cy="19" r="4.5"/><rect x="12" y="18" width="11" height="5.5"/></g>`;
}
function sun(cx, cy, r, r1, r2) {
  let rays = "";
  for (let a = 0; a < 8; a++) {
    const t = a * Math.PI / 4, c = Math.cos(t), s = Math.sin(t);
    rays += `<line x1="${(cx + c * r1).toFixed(1)}" y1="${(cy + s * r1).toFixed(1)}" x2="${(cx + c * r2).toFixed(1)}" y2="${(cy + s * r2).toFixed(1)}"/>`;
  }
  return `<g class="ic-sun"><circle cx="${cx}" cy="${cy}" r="${r}"/>${rays}</g>`;
}
function moon(dx, dy, s) {
  return `<path class="ic-moon" transform="translate(${dx},${dy}) scale(${s})" d="M20.5 5.5a10.5 10.5 0 1 0 6 18.5A8.5 8.5 0 0 1 20.5 5.5z"/>`;
}
function iconInner(code, isDay) {
  switch (kindOf(code)) {
    case "clear":  return isDay ? sun(16, 16, 6, 9, 12.5) : moon(-1, 0, 1);
    case "partly": return (isDay ? sun(11, 11, 4.5, 6.8, 9) : moon(-1, -1, .6)) + cloud(3, 4);
    case "cloud":  return cloud(-1, -0.5);
    case "fog":    return '<g class="ic-fog"><line x1="6" y1="12" x2="26" y2="12"/><line x1="8" y1="17.5" x2="28" y2="17.5"/><line x1="5" y1="23" x2="23" y2="23"/></g>';
    case "drizzle":return cloud(0, -4) + '<g class="ic-rain"><line x1="12" y1="23" x2="11" y2="25.5"/><line x1="17" y1="23" x2="16" y2="25.5"/><line x1="22" y1="23" x2="21" y2="25.5"/></g>';
    case "rain":   return cloud(0, -4) + '<g class="ic-rain"><line x1="12" y1="22" x2="10" y2="27.5"/><line x1="17" y1="22" x2="15" y2="27.5"/><line x1="22" y1="22" x2="20" y2="27.5"/></g>';
    case "snow":   return cloud(0, -4) + '<g class="ic-snow"><circle cx="11" cy="24" r="1.5"/><circle cx="16.5" cy="27.5" r="1.5"/><circle cx="22" cy="24" r="1.5"/></g>';
    default:       return cloud(0, -4) + '<polygon class="ic-bolt" points="17.5,19 12.5,26 16,26 14.5,31 21.5,23.5 18,23.5 20,19"/>';
  }
}
const iconSvg = (code, isDay, cls = "ic") => `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true">${iconInner(code, isDay)}</svg>`;

/* ---------- Data ---------- */
async function geocode(name) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=" + encodeURIComponent(name);
  const res = await fetch(url);
  if (!res.ok) throw new Error("City search failed (" + res.status + ")");
  const data = await res.json();
  const r = data.results && data.results[0];
  if (!r) return null;
  return { name: r.name, country: r.country || "", lat: r.latitude, lon: r.longitude };
}

async function forecast(p) {
  const params = new URLSearchParams({
    latitude: p.lat, longitude: p.lon, timezone: "auto", forecast_days: 7,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code,is_day",
    hourly: "temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,sunrise,sunset"
  });
  const res = await fetch("https://api.open-meteo.com/v1/forecast?" + params);
  if (!res.ok) throw new Error("Forecast unavailable (" + res.status + ")");
  return res.json();
}

async function lastYear(p, date) {
  const params = new URLSearchParams({
    latitude: p.lat, longitude: p.lon, timezone: "auto", start_date: date, end_date: date,
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum"
  });
  const res = await fetch("https://archive-api.open-meteo.com/v1/archive?" + params);
  if (!res.ok) throw new Error("History unavailable");
  return res.json();
}

/* ---------- Sky ---------- */
function skyState(c, day) {
  const k = kindOf(c.weather_code);
  if (k === "storm") return "storm";
  if (k === "rain" || k === "drizzle") return "rain";
  if (k === "snow") return "snow";
  if (k === "fog") return "fog";
  const now = mins(c.time);
  const nearSun = Math.abs(now - mins(day.sunrise[0])) <= 45 || Math.abs(now - mins(day.sunset[0])) <= 45;
  if (nearSun && k !== "cloud") return "dusk";
  if (k === "cloud") return c.is_day ? "cloudy-day" : "cloudy-night";
  return c.is_day ? "clear-day" : "clear-night";
}

/* ---------- What to wear ---------- */
function wearAdvice(h, i0, windNowStrong) {
  const end = Math.min(i0 + 12, h.time.length);
  let fmin = Infinity, fmax = -Infinity, wmax = 0, rainAt = null, rainMax = 0;
  for (let i = i0; i < end; i++) {
    const f = h.apparent_temperature[i];
    fmin = Math.min(fmin, f); fmax = Math.max(fmax, f);
    wmax = Math.max(wmax, h.wind_speed_10m[i]);
    const p = h.precipitation_probability[i] ?? 0;
    rainMax = Math.max(rainMax, p);
    if (p >= 50 && rainAt === null) rainAt = i;
  }
  let title, line;
  if (fmin <= 0)       { title = "Bundle up";       line = "Heavy coat, gloves and a hat."; }
  else if (fmin <= 7)  { title = "Coat weather";    line = "A warm coat, and a scarf for the evening."; }
  else if (fmin <= 13) { title = "Jacket weather";  line = "A proper jacket with a layer underneath."; }
  else if (fmin <= 19) { title = "Light layers";    line = "A light jacket or a sweater will do."; }
  else if (fmax <= 28) { title = "T-shirt weather"; line = fmin < 22 ? "T-shirt, with something light for later." : "T-shirt and light trousers or shorts."; }
  else                 { title = "Hot day";         line = "Shorts, a hat and plenty of water. Stay in the shade at midday."; }

  const extra = [];
  if (rainAt !== null) extra.push(rainAt === i0 ? "Rain is likely right now, take an umbrella." : `Rain likely from ${hhmm(h.time[rainAt])}, take an umbrella.`);
  else if (rainMax >= 25) extra.push(`Small chance of rain (${rainMax}%), a compact umbrella won't hurt.`);
  if (wmax >= 35 || windNowStrong) extra.push(`Windy, gusts up to ${round(wmax)} km/h. Something windproof helps.`);
  extra.push(`Feels like ${round(fmin)}° to ${round(fmax)}° over the next 12 hours.`);
  return { title, line, extra: extra.join(" ") };
}

/* ---------- Chart ---------- */
let state = null;

function drawChart() {
  if (!state) return;
  const { h, i0 } = state;
  const box = $("chart");
  const W = Math.max(300, Math.floor(box.clientWidth));
  const H = 196, padL = 16, padR = 16;
  const n = Math.min(25, h.time.length - i0);
  if (n < 2) { box.replaceChildren(); return; }
  const idx = Array.from({ length: n }, (_, k) => i0 + k);
  const temps = idx.map(i => h.temperature_2m[i]);
  let tmin = Math.min(...temps), tmax = Math.max(...temps);
  if (tmax - tmin < 4) { const m = (tmax + tmin) / 2; tmin = m - 2; tmax = m + 2; }
  const step = (W - padL - padR) / (n - 1);
  const X = k => padL + k * step;
  const T0 = 60, T1 = 126, R0 = 140, R1 = 168;
  const Y = t => T1 - (t - tmin) / (tmax - tmin) * (T1 - T0);
  const f = v => v.toFixed(1);

  let s = `<defs><linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c-stop1"/><stop offset="1" class="c-stop2"/></linearGradient></defs>`;

  // Night shading, merged into runs
  let k = 0;
  while (k < n) {
    if (h.is_day[idx[k]] === 0) {
      let e = k;
      while (e + 1 < n && h.is_day[idx[e + 1]] === 0) e++;
      const x1 = Math.max(0, X(k) - step / 2), x2 = Math.min(W, X(e) + step / 2);
      s += `<rect class="c-night" x="${f(x1)}" y="0" width="${f(x2 - x1)}" height="${R1}"/>`;
      k = e + 1;
    } else k++;
  }

  // Rain bars
  const bw = Math.min(10, step * 0.6);
  idx.forEach((i, k) => {
    const p = h.precipitation_probability[i] ?? 0;
    if (p > 0) {
      const bh = p / 100 * (R1 - R0);
      s += `<rect class="c-rain" x="${f(X(k) - bw / 2)}" y="${f(R1 - bh)}" width="${f(bw)}" height="${f(bh)}" rx="1.5"/>`;
    }
  });
  s += `<line class="c-axis" x1="0" y1="${R1 + .5}" x2="${W}" y2="${R1 + .5}"/>`;

  // Smooth temperature line
  const pts = temps.map((t, k) => [X(k), Y(t)]);
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let k = 0; k < n - 1; k++) {
    const p0 = pts[k - 1] || pts[k], p1 = pts[k], p2 = pts[k + 1], p3 = pts[k + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;
  }
  s += `<path d="${d} L${f(X(n - 1))},${R1} L${f(X(0))},${R1} Z" fill="url(#g-area)"/>`;
  s += `<path class="c-line" d="${d}"/>`;
  s += `<circle class="c-now" cx="${f(pts[0][0])}" cy="${f(pts[0][1])}" r="4.5"/>`;

  // Every 3 hours: icon, temperature, time
  for (let k = 0; k < n; k += 3) {
    const i = idx[k], x = X(k);
    s += `<svg x="${f(x - 13)}" y="6" width="26" height="26" viewBox="0 0 32 32">${iconInner(h.weather_code[i], h.is_day[i])}</svg>`;
    s += `<text class="c-temp" x="${f(x)}" y="${f(pts[k][1] - 10)}" text-anchor="middle">${round(temps[k])}°</text>`;
    s += `<text class="c-time" x="${f(x)}" y="${H - 8}" text-anchor="middle">${k === 0 ? "Now" : hhmm(h.time[i])}</text>`;
  }

  const label = `Temperature for the next 24 hours, from ${round(Math.min(...temps))}° to ${round(Math.max(...temps))}°.`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${label}">${s}</svg>`;
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });

/* ---------- Render ---------- */
function render(p, d) {
  const c = d.current, day = d.daily, h = d.hourly;
  const isThess = /thessalon/i.test(p.name);

  $("place").textContent = p.name;
  $("sub").textContent = [p.country, d.elevation != null ? round(d.elevation) + " m above sea level" : ""].filter(Boolean).join(" · ");
  document.title = p.name + " Weather";

  // Sky
  const sky = skyState(c, day);
  $("sky").className = "sky sky--" + sky;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", SKY_TOP[sky]);

  // Now
  $("now-icon").innerHTML = iconInner(c.weather_code, c.is_day);
  $("temp").innerHTML = round(c.temperature_2m) + "<small>°C</small>";
  $("cond").textContent = CODES[c.weather_code] || "Unknown";
  $("feels").textContent = "Feels like " + round(c.apparent_temperature) + "°";
  $("hilo").textContent = round(day.temperature_2m_max[0]) + "° / " + round(day.temperature_2m_min[0]) + "°";
  $("rain").textContent = (day.precipitation_probability_max[0] ?? 0) + "%";
  $("hum").textContent = c.relative_humidity_2m + "%";

  // The Vardaris is Thessaloniki's cold north-westerly wind down the Axios valley.
  const dir = c.wind_direction_10m;
  const vardaris = isThess && c.wind_speed_10m >= 25 && (dir >= 300 || dir <= 20);
  $("wind").innerHTML = round(c.wind_speed_10m) + " km/h " + compass(dir) + (vardaris ? '<span class="tag">VARDARIS</span>' : "");

  // Hour index for "now"
  const nowHour = c.time.slice(0, 13) + ":00";
  let i0 = h.time.findIndex(t => t >= nowHour);
  if (i0 < 0) i0 = 0;

  // What to wear
  const w = wearAdvice(h, i0, c.wind_speed_10m >= 35);
  $("wear-title").textContent = w.title;
  $("wear-line").textContent = w.line + (vardaris ? " The Vardaris is blowing, so add a windproof layer." : "");
  $("wear-extra").textContent = w.extra;
  $("wear").hidden = false;

  // Chart
  state = { h, i0 };
  drawChart();

  // 7 days, each expandable
  const days = $("days");
  days.replaceChildren();
  day.time.forEach((t, k) => {
    const li = document.createElement("li");
    const name = k === 0 ? "Today" : new Date(t + "T12:00").toLocaleDateString("en-GB", { weekday: "short" });
    const pr = day.precipitation_probability_max[k] ?? 0;
    const base = h.time.findIndex(x => x.startsWith(t));

    let slots = "";
    if (base >= 0) {
      for (let j = 0; j < 24; j += 3) {
        const i = base + j;
        if (i >= h.time.length) break;
        const pp = h.precipitation_probability[i] ?? 0;
        slots += `<div class="slot"><span class="t">${hhmm(h.time[i])}</span>${iconSvg(h.weather_code[i], h.is_day[i])}<span class="v">${round(h.temperature_2m[i])}°</span><span class="p">${pp >= 10 ? pp + "%" : ""}</span></div>`;
      }
    }

    li.innerHTML = `<details name="day">
      <summary class="day">
        <span class="d"></span>${iconSvg(day.weather_code[k], 1)}<span class="c"></span>
        <span class="r">${pr >= 10 ? pr + "%" : ""}</span>
        <span class="hl">${round(day.temperature_2m_max[k])}° <span>${round(day.temperature_2m_min[k])}°</span></span>
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="day-more">
        <div class="slots-wrap"><div class="slots">${slots}</div></div>
        <div class="day-meta">
          <span>Rain <b>${(day.precipitation_sum[k] ?? 0).toFixed(1)} mm</b></span>
          <span>Wind up to <b>${round(day.wind_speed_10m_max[k])} km/h</b></span>
          <span>Sunrise <b>${hhmm(day.sunrise[k])}</b></span>
          <span>Sunset <b>${hhmm(day.sunset[k])}</b></span>
        </div>
      </div>
    </details>`;
    li.querySelector(".d").textContent = name;
    li.querySelector(".c").textContent = CODES[day.weather_code[k]] || "";
    days.appendChild(li);
  });

  $("sun").innerHTML = "<span>Sunrise <b>" + hhmm(day.sunrise[0]) + "</b></span><span>Sunset <b>" + hhmm(day.sunset[0]) + "</b></span>";
  $("updated").textContent = "Updated " + hhmm(c.time) + " local time";
}

function renderLastYear(date, ly, todayMax) {
  const d = ly.daily;
  if (!d || !d.time || d.temperature_2m_max[0] == null) { $("ly-section").hidden = true; return; }
  const hi = d.temperature_2m_max[0], lo = d.temperature_2m_min[0], code = d.weather_code[0], mm = d.precipitation_sum[0] ?? 0;
  $("ly-icon").innerHTML = iconInner(code, 1);
  $("ly-when").textContent = new Date(date + "T12:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("ly-vals").innerHTML = round(hi) + "° <span>/ " + round(lo) + "°</span>";
  $("ly-what").textContent = (CODES[code] || "") + (mm >= 0.2 ? " · " + mm.toFixed(1) + " mm of rain" : " · dry");
  const diff = round(todayMax - hi);
  const cmp = $("ly-compare");
  if (Math.abs(diff) < 1) cmp.textContent = "Today's high is about the same as last year.";
  else cmp.innerHTML = `Today's high is <b>${Math.abs(diff)}° ${diff > 0 ? "warmer" : "colder"}</b> than on this day last year.`;
  $("ly-section").hidden = false;
}

function showError(msg) { $("sub").textContent = msg; }

let current = DEFAULT;
let requestId = 0;

async function show(place) {
  const id = ++requestId;
  $("app").classList.add("loading");
  try {
    const data = await forecast(place);
    if (id !== requestId) return;
    current = place;
    render(place, data);

    // This day last year (Feb 29 falls back to Feb 28)
    const today = data.daily.time[0];
    let md = today.slice(5);
    if (md === "02-29") md = "02-28";
    const date = (Number(today.slice(0, 4)) - 1) + "-" + md;
    lastYear(place, date)
      .then(ly => { if (id === requestId) renderLastYear(date, ly, data.daily.temperature_2m_max[0]); })
      .catch(() => { if (id === requestId) $("ly-section").hidden = true; });
  } catch (e) {
    if (id === requestId) showError(e.message + ". Check your connection and try again.");
  } finally {
    if (id === requestId) $("app").classList.remove("loading");
  }
}

$("search").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("city").value.trim();
  if (!q) { save("city", ""); return show(DEFAULT); }
  try {
    const p = await geocode(q);
    if (!p) { showError('No city called "' + q + '" found. Try another spelling.'); return; }
    save("city", JSON.stringify(p));
    $("city").value = "";
    show(p);
  } catch (err) {
    showError(err.message + ".");
  }
});

// Start: ?city=Athens in the URL wins, then the last city searched, then Thessaloniki
(async () => {
  const q = new URLSearchParams(location.search).get("city");
  if (q) {
    try { const p = await geocode(q); if (p) return show(p); } catch (e) {}
  }
  const saved = load("city");
  if (saved) { try { return show(JSON.parse(saved)); } catch (e) {} }
  show(DEFAULT);
})();

// Refresh every 15 minutes while the page is open
setInterval(() => show(current), 15 * 60 * 1000);
</script>
